services:
  svyaz:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: svyaz-server
    expose:
      - "5000"
    volumes:
      - ./server_data:/app/server_data
      - ./avatars:/app/server_data/avatars
    environment:
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-this-in-production}
      - DATA_DIR=/app/server_data
      - FLASK_ENV=production
    restart: unless-stopped
    command: ["run", "-H", "0.0.0.0", "-p", "5000"]
    networks:
      - svyaz-net

  caddy:
    image: caddy:2-alpine
    container_name: caddy-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - svyaz-net

networks:
  svyaz-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
